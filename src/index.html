<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="CalenRun42 — Pianifica la tua maratona, gestisci allenamenti e gare dal tuo smartphone.">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>CalenRun42</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Favicon / Icone -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Font: Inter (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stili -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ═══════════════════════════════════════════ -->
  <!-- HEADER                                      -->
  <!-- ═══════════════════════════════════════════ -->
  <header id="app-header" class="app-header">
    <div class="header-content">
      <h1 class="app-title">🏃 CalenRun42</h1>
      <button id="btn-settings" class="btn-icon" aria-label="Impostazioni">
        <span class="icon">⚙️</span>
      </button>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════ -->
  <!-- NAVIGAZIONE TAB                             -->
  <!-- ═══════════════════════════════════════════ -->
  <nav id="app-nav" class="app-nav">
    <button class="nav-tab active" data-view="calendario" id="tab-calendario">
      <span class="nav-icon">📅</span>
      <span class="nav-label">Calendario</span>
    </button>
    <button class="nav-tab" data-view="ritmi" id="tab-ritmi">
      <span class="nav-icon">⏱️</span>
      <span class="nav-label">Ritmi</span>
    </button>
    <button class="nav-tab" data-view="gare" id="tab-gare">
      <span class="nav-icon">🏆</span>
      <span class="nav-label">Gare</span>
    </button>
  </nav>

  <!-- ═══════════════════════════════════════════ -->
  <!-- CONTENUTO PRINCIPALE                        -->
  <!-- ═══════════════════════════════════════════ -->
  <main id="app-main" class="app-main">

    <!-- Vista Calendario (default) -->
    <section id="view-calendario" class="view active">
      <div class="view-header">
        <h2>Piano di Allenamento</h2>
        <button id="btn-add-week" class="btn-primary btn-sm">+ Settimana</button>
      </div>
      <div id="weeks-container" class="weeks-container">
        <!-- Le settimane verranno renderizzate qui da JS -->
        <div class="empty-state">
          <p class="empty-icon">📋</p>
          <p class="empty-text">Nessun piano caricato</p>
          <p class="empty-hint">Aggiungi una settimana per iniziare</p>
        </div>
      </div>
    </section>

    <!-- Vista Ritmi -->
    <section id="view-ritmi" class="view">
      <div class="view-header">
        <h2>Configurazione Ritmi</h2>
      </div>
      <div id="paces-container" class="paces-container">
        <!-- Configurazione ritmi renderizzata qui da JS -->
        <div class="empty-state">
          <p class="empty-icon">⏱️</p>
          <p class="empty-text">Ritmi non configurati</p>
          <p class="empty-hint">Inserisci il tempo del test per calcolare i ritmi</p>
        </div>
      </div>
    </section>

    <!-- Vista Gare -->
    <section id="view-gare" class="view">
      <div class="view-header">
        <h2>Gare</h2>
        <button id="btn-add-race" class="btn-primary btn-sm">+ Gara</button>
      </div>
      <div id="races-container" class="races-container">
        <!-- Lista gare renderizzata qui da JS -->
        <div class="empty-state">
          <p class="empty-icon">🏆</p>
          <p class="empty-text">Nessuna gara inserita</p>
          <p class="empty-hint">Aggiungi una gara per ancorarla al piano</p>
        </div>
      </div>
    </section>

  </main>

  <!-- ═══════════════════════════════════════════ -->
  <!-- SCRIPTS                                     -->
  <!-- ═══════════════════════════════════════════ -->
  <script src="js/app.js" type="module"></script>

</body>
</html>
